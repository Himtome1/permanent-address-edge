# /etc/wireguard/wg0.conf on a NODE
# The node dials out to the edge and keeps the tunnel open.
# All values are placeholders.

[Interface]
Address    = 10.0.0.2/24
PrivateKey = <NODE_A_PRIVATE_KEY>

[Peer]
PublicKey           = <EDGE_PUBLIC_KEY>
Endpoint            = <EDGE_PUBLIC_IP>:51820
AllowedIPs          = 10.0.0.1/32
PersistentKeepalive = 25
