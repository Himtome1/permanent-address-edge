# /etc/wireguard/wg0.conf on the EDGE
# The edge is the only public address players use. Each node is one peer.
# All values are placeholders.

[Interface]
Address    = 10.0.0.1/24
ListenPort = 51820
PrivateKey = <EDGE_PRIVATE_KEY>

# node-a
[Peer]
PublicKey  = <NODE_A_PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32

# node-b
[Peer]
PublicKey  = <NODE_B_PUBLIC_KEY>
AllowedIPs = 10.0.0.3/32
