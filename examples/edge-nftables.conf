#!/usr/sbin/nft -f
# nftables on the EDGE for games whose protocol carries no hostname
# (Valheim, Terraria, Project Zomboid). Each server gets its own port
# on the edge; it is DNATed over WireGuard to the same port on its node.
# Ports come from one fleet-wide pool, so a server keeps its port when it moves:
# a move only changes the node address in the map below.
# All values are placeholders. Needs net.ipv4.ip_forward=1.

table ip gameedge {
    # port -> node tunnel address
    map game_tcp {
        type inet_service : ipv4_addr
        elements = { 30000 : 10.0.0.2, 30001 : 10.0.0.3 }
    }
    map game_udp {
        type inet_service : ipv4_addr
        elements = { 30000 : 10.0.0.2, 30001 : 10.0.0.3 }
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname "<PUBLIC_IFACE>" tcp dport @game_tcp dnat to tcp dport map @game_tcp
        iifname "<PUBLIC_IFACE>" udp dport @game_udp dnat to udp dport map @game_udp
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # SNAT forwarded traffic so replies go back through the tunnel.
        # Trade-off: game servers see every player as the edge's tunnel
        # address (10.0.0.1), so IP bans don't work (this matters for
        # Terraria). Valheim and Project Zomboid ban by SteamID, so they're
        # unaffected.
        oifname "wg0" ct status dnat masquerade
    }
}
